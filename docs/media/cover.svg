<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">AutoTaTa — a designer-led AI-assisted desktop experiment by maozo</title>
  <desc id="desc">A cream and navy project cover with four feature cards. Source available for noncommercial use. Frozen at version 0.2.36.</desc>
  <rect width="1440" height="620" rx="36" fill="#e9edf8"/>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#102246">
