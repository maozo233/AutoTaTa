    <text x="55" y="199" font-size="105" font-weight="850" letter-spacing="-5">AutoTaTa</text>
    <text x="60" y="251" font-size="26">From interface decisions to working software.</text>
    <text x="60" y="289" font-size="23" fill="#516987">A designer-led Vibe Coding experiment by maozo.</text>
